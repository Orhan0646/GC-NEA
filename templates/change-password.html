<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - GeoChallenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1a2a6c, #3a7bd5); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 520px; width: 100%; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(255,255,255,0.95); border-radius: 10px; margin-bottom: 24px; }
        header h1 { font-size: 1.6rem; color: #1a2a6c; }
        .btn-back { padding: 8px 18px; background: #1a2a6c; color: white; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .btn-back:hover { background: #3a7bd5; }

        .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        .card-title { font-size: 1.4rem; font-weight: 700; color: #1a2a6c; margin-bottom: 8px; }
        .card-sub   { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 28px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
        .form-group label { font-size: 0.88rem; font-weight: 600; color: #2c3e50; }
        .form-control { padding: 11px 14px; border: 2px solid #e1e5e9; border-radius: 8px; font-size: 0.95rem; transition: border-color 0.2s; }
        .form-control:focus { border-color: #3a7bd5; outline: none; }
        .form-hint { font-size: 0.78rem; color: #7f8c8d; margin-top: 2px; }

        .btn-submit { width: 100%; padding: 13px; background: #1a2a6c; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn-submit:hover { background: #3a7bd5; }

        .alert { padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; font-size: 0.95rem; }
        .alert-error   { background: #fdf2f2; color: #c0392b; border-left: 4px solid #e74c3c; }
        .alert-success { background: #eafaf1; color: #1e8449; border-left: 4px solid #2ecc71; }

        .divider { border: none; border-top: 1px solid #ecf0f1; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>GeoChallenge</h1>
            <div style="font-size:0.85rem;color:#7f8c8d;">Change Password</div>
        </div>
        <a href="/student-dashboard" class="btn-back">← Dashboard</a>
    </header>

    <div class="card">
        <div class="card-title">🔒 Change Password</div>
        <div class="card-sub">Enter your current password to set a new one.</div>

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">✅ {{ success }}</div>
        <hr class="divider">
        {% endif %}

        <form method="POST" action="/change-password">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" name="current_password" id="current_password"
                       class="form-control" placeholder="Enter current password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password"
                       class="form-control" placeholder="Enter new password" required>
                <span class="form-hint">Minimum 6 characters.</span>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password"
                       class="form-control" placeholder="Repeat new password" required>
            </div>
            <button type="submit" class="btn-submit">🔒 Change Password</button>
        </form>
    </div>
</div>
</body>
</html>
